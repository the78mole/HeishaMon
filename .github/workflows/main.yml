name: Build binary

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/the78mole/heishamon-pio:v0.0.9
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for semver action

      - name: Determine version
        id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "/^(feat|fix|refactor)!:/"
          minor_pattern: "/^feat:/"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: true
          search_commit_body: false

      - name: Update version.h
        run: |
          cd HeishaMon
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "static const char *heishamon_version = \"v${{ steps.version.outputs.version }}\";" > version.h
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "static const char *heishamon_version = \"v${{ steps.version.outputs.version }}-pr${{ github.event.number }}-$(git rev-parse --short HEAD)\";" > version.h
          else
            echo "static const char *heishamon_version = \"v${{ steps.version.outputs.version }}-dev-$(git rev-parse --short HEAD)\";" > version.h
          fi
          cat version.h
        shell: bash

      - name: Build with PlatformIO
        run: |
          pio run --environment esp8266
          pio run --environment esp32s3

      - name: Rename and add checksums to binaries
        run: |
          cd .pio/build

          # ESP8266
          if [ -f esp8266/firmware.bin ]; then
            MD5_ESP8266=$(md5sum esp8266/firmware.bin | cut -d' ' -f1)
            cp esp8266/firmware.bin ../../HeishaMon_ESP8266-v${{ steps.version.outputs.version }}-${MD5_ESP8266:0:8}.bin
          fi

          # ESP32-S3
          if [ -f esp32s3/firmware.bin ]; then
            MD5_ESP32S3=$(md5sum esp32s3/firmware.bin | cut -d' ' -f1)
            cp esp32s3/firmware.bin ../../HeishaMon_ESP32S3-v${{ steps.version.outputs.version }}-${MD5_ESP32S3:0:8}.bin
          fi

          cd ../..
          ls -la HeishaMon_*.bin
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: |
            ${{ github.event_name == 'pull_request' &&
                format('HeishaMon-v{0}-pr{1}', steps.version.outputs.version, github.event.number) ||
                format('HeishaMon-v{0}', steps.version.outputs.version) }}
          path: HeishaMon_*.bin

      - name: Create Release (on main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: HeishaMon v${{ steps.version.outputs.version }}
          body: |
            ## HeishaMon Release v${{ steps.version.outputs.version }}

            **Release Date:** ${{ steps.version.outputs.version_tag }}
            **Build:** ${{ github.run_number }} | **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            ### 🔄 Recent Changes

            ${{ steps.version.outputs.changed }}

            ### 📦 Available Binaries

            | Platform | Binary | Flash Size | Target Board |
            |----------|--------|------------|--------------|
            | **ESP8266** | `HeishaMon_ESP8266-v${{ steps.version.outputs.version }}-*.bin` | 4MB | WeMos D1 Mini |
            | **ESP32-S3** | `HeishaMon_ESP32S3-v${{ steps.version.outputs.version }}-*.bin` | 4MB + 2MB PSRAM | ESP32-S3 Development Boards |

            ### 🛠️ Installation

            #### Option 1: Web Flash Tool (Recommended)
            Use the [ESP Web Tools](https://esphome.github.io/esp-web-tools/) for easy browser-based flashing.

            #### Option 2: Command Line
            ```bash
            # ESP8266
            esptool.py --port /dev/ttyUSB0 --baud 921600 write_flash 0x0 HeishaMon_ESP8266-*.bin

            # ESP32-S3 (USB-CDC)
            esptool.py --port /dev/ttyACM0 --baud 921600 write_flash 0x0 HeishaMon_ESP32S3-*.bin
            ```

            ### 🔧 Technical Details

            - **Build System:** PlatformIO ${{ env.PLATFORMIO_VERSION || 'Latest' }}
            - **Arduino Framework:** ESP8266 Core + ESP32 Core
            - **Compiler:** GCC with optimization flags
            - **Libraries:** ArduinoJson, PubSubClient, OneWire, DallasTemperature, Adafruit NeoPixel

            ### 📋 Changelog

            For detailed changes, see the [commit history](https://github.com/${{ github.repository }}/compare/${{ steps.version.outputs.previous_tag }}...v${{ steps.version.outputs.version }}) since the last release.

            ---

            💡 **Need Help?** Check the [Documentation](https://github.com/${{ github.repository }}/blob/main/README.md) or open an [Issue](https://github.com/${{ github.repository }}/issues/new).
          files: HeishaMon_*.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
